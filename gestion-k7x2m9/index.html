<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep the panel out of search engines and never leak its address. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <!-- Only code from this site may run, and the only server the page may
         talk to is GitHub: the token cannot be sent anywhere else. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob: data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'"
    />
    <title>Panel · Datos Online</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2300b2ff%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial,sans-serif%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23060b1a%27%3ED%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/style.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="panel-page">
    <main id="panel" class="panel"></main>
    <noscript>El panel necesita JavaScript activado.</noscript>
    <script type="module" src="panel.js"></script>
  </body>
</html>
