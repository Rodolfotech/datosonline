# Publishes the site to GitHub Pages. There is no build step: the site is plain
# HTML, CSS and JavaScript, so only the files the browser needs are uploaded.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Collect the site files
        run: |
          mkdir -p _site/src
          cp -r index.html privacidad.html img sitemap.xml robots.txt _site/
          cp -r src/style.css src/main.js src/components src/data src/lib src/fonts _site/src/
          cp -r gestion-k7x2m9 guias _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
